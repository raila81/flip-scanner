name: Research candle download
on:
  workflow_dispatch:
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: Fetch 15-min candles for tracked coins (one call per coin, about 25 a minute)
        env:
          MAX_MIN: "320"
          OUT: candles.jsonl
        run: python3 research/survivor/fetch.py data/track.json data/books.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candles
          path: candles.jsonl
          retention-days: 7
