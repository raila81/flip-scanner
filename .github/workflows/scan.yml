name: Hourly flip scan

on:
  schedule:
    # GitHub runs schedules "best effort" and drops some, mostly on quiet repos. Two slots an hour,
    # off the busy :00 mark, so a dropped run is covered. The concurrency group stops overlaps.
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the scan
        run: python3 scanner/scan.py --hours 6 --chains pumpfun,robinhood,movers --out data
      - name: Save results
        run: |
          git config user.name "flip-scanner bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/latest.json data/track.json
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "Hourly scan $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase origin main
          git push
